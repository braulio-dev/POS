# Sync server only. TLS is handled by the Caddy you already run on this VPS —
# see Caddyfile.snippet for the block to paste into your existing Caddyfile.
#
#   cp .env.example .env     # then edit it — POS_SYNC_KEY
#   docker compose up -d

services:
  pos-sync:
    build: .
    # Survives crashes and reboots, but stays down if you deliberately stop it.
    restart: unless-stopped

    ports:
      # Loopback ONLY. Your Caddy reaches this over 127.0.0.1; the internet
      # cannot.
      #
      # Do not shorten this to "8787:8787". That binds 0.0.0.0 and publishes the
      # API — whose only auth is a bearer token — straight to the internet. It
      # is worse than it looks on a VPS: Docker writes its own iptables rules
      # ahead of ufw, so a published port is reachable even when `ufw status`
      # swears it is blocked.
      - "127.0.0.1:8787:8787"

    environment:
      POS_SYNC_KEY: ${POS_SYNC_KEY:?POS_SYNC_KEY is required - copy .env.example to .env}
      PORT: 8787
      POS_DATA_DIR: /data

      # Every 5 minutes for now; change to 1d when the shop has been running a
      # while. Units: s, m, h, d.
      POS_BACKUP_ENABLED: ${POS_BACKUP_ENABLED:-1}
      POS_BACKUP_INTERVAL: ${POS_BACKUP_INTERVAL:-5m}
      POS_BACKUP_KEEP: ${POS_BACKUP_KEEP:-48}

      # Off until you decide how much history to keep. This deletes permanently.
      POS_PURGE_ENABLED: ${POS_PURGE_ENABLED:-0}
      POS_PURGE_INTERVAL: ${POS_PURGE_INTERVAL:-1d}
      POS_PURGE_DAYS: ${POS_PURGE_DAYS:-365}
      POS_PURGE_CHANGES_DAYS: ${POS_PURGE_CHANGES_DAYS:-30}
      POS_STALE_STORE_DAYS: ${POS_STALE_STORE_DAYS:-30}

    volumes:
      - pos-data:/data

  # --- If your Caddy runs in Docker rather than on the host -----------------
  #
  # A container cannot reach the host's 127.0.0.1, so the loopback binding above
  # is useless to it. Instead: delete the `ports:` block, and join the network
  # your Caddy container is already on —
  #
  #     networks: [web]
  #
  # then add at the bottom of this file:
  #
  #     networks:
  #       web:
  #         external: true
  #
  # and proxy to `pos-sync:8787` (the service name) instead of `127.0.0.1:8787`.
  # Find the network name with: docker inspect -f '{{json .NetworkSettings.Networks}}' <caddy-container>

volumes:
  pos-data:
