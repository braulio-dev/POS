# Packaging for the register. Kept as YAML rather than a "build" block in
# package.json so the decisions below can carry the reasoning with them.

appId: mx.elpaisa.pos
productName: POS El Paisa
copyright: Abarrotes El Paisa

directories:
  output: release
  buildResources: build

# Allow-list, not a deny-list: anything not named here stays out of the
# installer. That keeps src/, the .captures* screenshot dumps, the sync server
# and the seed scripts off the shop machine.
files:
  - electron/**/*
  - dist/**/*
  - scripts/raw-print.ps1
  - package.json

# The ESC/POS spooler is run by powershell.exe, which is not an Electron process
# and cannot read inside app.asar. It ships via `files` above, then gets
# unpacked back out to a real path on disk; electron/printer.cjs rewrites its
# __dirname-derived path to match.
asarUnpack:
  - scripts/raw-print.ps1

win:
  # Both arches, because the shop counter is whatever PC the store already owns.
  # At least one register runs 32-bit Windows 10 22H2, and an x64-only installer
  # simply will not start there. Listing both makes electron-builder emit ONE
  # installer carrying both binaries, which picks the right one at install time
  # -- the technician carries a single file and never has to check the machine.
  # Nothing here is arch-sensitive to build: there are no native modules, since
  # the database is Node's built-in node:sqlite (see electron/db.cjs).
  target:
    - target: nsis
      arch: [x64, ia32]
  icon: build/icon.png
  # There is no code-signing certificate, so Windows SmartScreen warns on the
  # first run. README.md tells the installer what to click.

nsis:
  # Per-user, not per-machine: no admin prompt during install, and it matches
  # how autostart is registered (HKCU\...\Run, see electron/kiosk.cjs).
  perMachine: false
  oneClick: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  # The register is the point of the machine, so launching straight after install
  # means the owner sees it working before the technician leaves.
  runAfterFinish: true
  # Product images and the database live in userData and must survive an
  # upgrade. Deleting them would wipe the shop's catalogue.
  deleteAppDataOnUninstall: false
